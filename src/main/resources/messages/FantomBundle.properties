inlay.fantom.types.name=Inferred types
inlay.fantom.types.description=Shows the inferred type of a local variable declared with ':=' and of an untyped closure parameter. Hidden when the initializer is a literal or a constructor call.
inlay.fantom.parameters.name=Parameter names
inlay.fantom.parameters.description=Shows the parameter name before each argument of a call with two or more parameters. Hidden when the argument already names the parameter, is a closure, or the method is an operator-like slot such as get, set, plus or echo.
