name: Build and verify
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew --no-daemon generateLexer generateParser test buildPlugin
      - name: Verify against the pinned and the newest IDE builds
        run: ./gradlew --no-daemon verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip

  publish:
    # Publishes only when the Marketplace token is configured; a tag without it still builds.
    if: startsWith(github.ref, 'refs/tags/v') && vars.MARKETPLACE_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x gradlew
      - name: Publish to the JetBrains Marketplace
        run: ./gradlew --no-daemon publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
